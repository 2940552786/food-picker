<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>💕 想吃什么呢？</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --purple: #c44dff;
            --rose: #ff4d6a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #fff0f5 0%, #f8e8ff 25%, #ffe0ec 50%, #f3e6ff 75%, #fff0f5 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* ---- 浮动背景 ---- */
        .hearts-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .heart-float {
            position: absolute; opacity: 0.13;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.13; }
            90%  { opacity: 0.13; }
            100% { transform: translateY(-10vh) scale(1.1) rotate(360deg); opacity: 0; }
        }

        /* ---- 主容器 ---- */
        .container {
            position: relative; z-index: 1;
            max-width: 800px; margin: 0 auto; padding: 25px 18px 50px;
        }

        /* ---- 头部 ---- */
        .header { text-align: center; margin-bottom: 8px; }
        .header .icon-row {
            font-size: 46px; display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-10px); }
        }
        .header h1 {
            font-size: clamp(26px, 5.5vw, 38px);
            background: linear-gradient(135deg, #ff4d6a, #c44dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 6px 0 2px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: clamp(13px, 2.2vw, 15px);
            color: #9b8aad; font-weight: 400;
        }

        /* ---- 网格 ---- */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px; margin-top: 22px;
        }
        @media (min-width: 600px) {
            .food-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
        }
        @media (min-width: 800px) {
            .food-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
        }
        /* 10个卡片: 4*2 + 2 在第三行 -> 最后一行两个居中 */
        @media (min-width: 800px) {
            .food-grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* ---- 卡片 ---- */
        .food-card {
            position: relative; border-radius: 18px;
            overflow: hidden; cursor: pointer;
            aspect-ratio: 1 / 1;
            background: #e8ddf5;
            box-shadow: 0 4px 18px rgba(150,100,180,0.13);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .food-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 12px 32px rgba(150,100,180,0.22);
        }
        .food-card:active { transform: scale(0.95); transition: transform 0.1s ease; }

        .food-card .card-img {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            transition: transform 0.5s ease;
        }
        .food-card:hover .card-img { transform: scale(1.08); }

        .food-card .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top,
                rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.02) 100%);
        }
        .food-card .card-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 14px 10px;
            color: #fff; font-weight: 800;
            font-size: clamp(15px, 2.8vw, 18px);
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .food-card .card-emoji {
            position: absolute; top: 10px; right: 10px;
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }
        .food-card:hover .card-emoji { transform: scale(1.2) rotate(-10deg); }

        /* "其他" 卡片特殊样式 */
        .food-card.card-other {
            border: 3px dashed rgba(180,150,200,0.5);
            background: linear-gradient(135deg, #faf5ff, #fff5f8);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 6px;
        }
        .food-card.card-other .other-icon {
            font-size: 40px; transition: transform 0.3s ease;
        }
        .food-card.card-other:hover .other-icon { transform: scale(1.15) rotate(5deg); }
        .food-card.card-other .other-text {
            font-size: 16px; font-weight: 700; color: #8b7bab;
            letter-spacing: 1px;
        }
        .food-card.card-other .other-hint {
            font-size: 11px; color: #b8a8cc;
        }

        /* ---- 模态弹窗 ---- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }

        .modal-dialog {
            background: #fff; border-radius: 24px;
            padding: 32px 26px 26px;
            width: 90%; max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8) translateY(30px); opacity:0; }
            to   { transform: scale(1) translateY(0); opacity:1; }
        }
        .modal-dialog .modal-emoji { font-size: 56px; margin-bottom: 8px; }
        .modal-dialog h2 { font-size: 20px; color: #2d1b3d; margin-bottom: 4px; }
        .modal-dialog .food-name-highlight {
            display: inline-block;
            background: linear-gradient(135deg, #fff0f5, #f8e8ff);
            color: #c44dff; font-weight: 800; font-size: 24px;
            padding: 2px 14px; border-radius: 12px; margin: 8px 0 14px;
            max-width: 100%; word-break: break-all;
        }
        .modal-dialog .modal-sub {
            color: #8b7b9b; font-size: 13px; margin-bottom: 4px;
        }

        /* 输入框 */
        .modal-input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e8ddf5; border-radius: 14px;
            font-size: 18px; text-align: center;
            font-weight: 600; color: #2d1b3d;
            outline: none; transition: border 0.2s;
            letter-spacing: 1px;
        }
        .modal-input:focus { border-color: #c44dff; }
        .modal-input::placeholder { color: #c8b8d8; font-weight: 400; }

        .modal-buttons { display: flex; gap: 12px; margin-top: 18px; }

        .btn {
            flex: 1; padding: 13px 16px; border-radius: 14px;
            border: none; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.95); }
        .btn-cancel { background: #f0e8f5; color: #6b5b7b; }
        .btn-cancel:hover { background: #e5d8f0; }
        .btn-confirm {
            background: linear-gradient(135deg, #ff4d6a, #c44dff);
            color: #fff;
            box-shadow: 0 4px 16px rgba(196,77,255,0.3);
        }
        .btn-confirm:hover {
            box-shadow: 0 6px 24px rgba(196,77,255,0.45);
            transform: translateY(-2px);
        }
        .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ---- Toast ---- */
        .toast {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%); z-index: 2000;
            padding: 15px 26px; border-radius: 18px;
            font-weight: 700; font-size: 15px; color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            animation: slideDown 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            text-align: center; max-width: 90%;
        }
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-80px); opacity:0; }
            to   { transform: translateX(-50%) translateY(0); opacity:1; }
        }
        .toast-success { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .toast-error  { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* ---- Footer ---- */
        .footer {
            text-align: center; margin-top: 35px;
            color: #c8b8d8; font-size: 12px; letter-spacing: 1px;
        }
        .footer .heart {
            color: #ff6b9d; display: inline-block;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%,100%{transform:scale(1)} 25%{transform:scale(1.3)} 50%{transform:scale(1)} 75%{transform:scale(1.3)}
        }

        /* 提示小字 */
        .input-hint { font-size: 11px; color: #b8a8cc; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <div class="header">
            <div class="icon-row">💕</div>
            <h1>想吃什么呢？</h1>
            <p class="subtitle">选一个你想吃的，告诉我~</p>
        </div>

        <div class="food-grid" id="foodGrid"></div>

        <div class="footer">
            Made with <span class="heart">❤️</span> for our date
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modalConfirm" style="display:none;">
        <div class="modal-dialog">
            <div class="modal-emoji" id="modalEmoji">🔥</div>
            <h2>就选这个？</h2>
            <div class="food-name-highlight" id="modalFoodName">火锅</div>
            <p class="modal-sub">告诉他，带你去吃~</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeAllModals()">再想想</button>
                <button class="btn btn-confirm" id="btnConfirm" onclick="sendNotify()">
                    ✨ 就吃这个！
                </button>
            </div>
        </div>
    </div>

    <!-- "其他" 输入弹窗 -->
    <div class="modal-overlay" id="modalOther" style="display:none;">
        <div class="modal-dialog">
            <div class="modal-emoji">✏️</div>
            <h2>想吃点什么？</h2>
            <p class="modal-sub">手动写下你想吃的~</p>
            <input type="text" class="modal-input" id="customFoodInput"
                placeholder="比如：螺蛳粉、椰子鸡..."
                maxlength="20" autocomplete="off">
            <p class="input-hint">写好后点确认，就会告诉他啦~</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeAllModals()">取消</button>
                <button class="btn btn-confirm" id="btnCustomConfirm" onclick="confirmCustom()">
                    ✨ 就吃这个！
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const SENDKEY = 'SCT379441Tav8ooADrFYlXdiwLEZTrvM7D';
        const SERVER_CHAN_URL = 'https://sctapi.ftqq.com';

        // ==================== 美食数据（9个精选 + 真实图片） ====================
        const foods = [
            { name: '湘菜',   emoji: '🌶️' },
            { name: '烤鱼',   emoji: '🐟' },
            { name: '日料',   emoji: '🍣' },
            { name: '小火锅', emoji: '🫕' },
            { name: '烤肉',   emoji: '🥩' },
            { name: '西餐',   emoji: '🍝' },
            { name: '麻辣烫', emoji: '🥘' },
            { name: '披萨',   emoji: '🍕' },
            { name: '汉堡',   emoji: '🍔' },
        ];

        let selectedFood = null;

        // ==================== 浮动爱心 ====================
        function createHearts() {
            const c = document.getElementById('heartsBg');
            const hearts = ['💕','💖','💗','💝','💘','❤️','💓','🩷','💌','🌹'];
            for(let i=0; i<22; i++) {
                const h = document.createElement('span');
                h.className = 'heart-float';
                h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
                h.style.left = Math.random()*95+'%';
                h.style.fontSize = (12+Math.random()*24)+'px';
                h.style.animationDuration = (8+Math.random()*16)+'s';
                h.style.animationDelay = Math.random()*12+'s';
                c.appendChild(h);
            }
        }

        // ==================== 生成卡片 ====================
        function createCards() {
            const grid = document.getElementById('foodGrid');

            foods.forEach((food, i) => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.onclick = () => openConfirm(food);

                // 纯色渐变背景 + 大 emoji，简洁好看
                const bg = document.createElement('div');
                bg.className = 'card-img';
                bg.style.background = hslGradient(i);
                bg.style.display = 'flex';
                bg.style.alignItems = 'center';
                bg.style.justifyContent = 'center';
                bg.style.fontSize = '64px';

                const bigEmoji = document.createElement('span');
                bigEmoji.textContent = food.emoji;
                bigEmoji.style.filter = 'drop-shadow(0 4px 12px rgba(0,0,0,0.25))';
                bg.appendChild(bigEmoji);

                const overlay = document.createElement('div');
                overlay.className = 'card-overlay';

                const label = document.createElement('div');
                label.className = 'card-label';
                label.textContent = food.name;

                card.appendChild(bg);
                card.appendChild(overlay);
                card.appendChild(label);
                grid.appendChild(card);
            });

            // "其他" 卡片
            const otherCard = document.createElement('div');
            otherCard.className = 'food-card card-other';
            otherCard.onclick = () => openOther();
            otherCard.innerHTML = `
                <div class="other-icon">✏️</div>
                <div class="other-text">其他</div>
                <div class="other-hint">手动输入</div>
            `;
            grid.appendChild(otherCard);
        }

        function hslGradient(i) {
            const gradients = [
                'linear-gradient(135deg, #ff6b6b, #ee5a24)',
                'linear-gradient(135deg, #ff9f43, #f368e0)',
                'linear-gradient(135deg, #feca57, #ff9f43)',
                'linear-gradient(135deg, #ff6348, #e84393)',
                'linear-gradient(135deg, #e056a0, #c44569)',
                'linear-gradient(135deg, #a29bfe, #6c5ce7)',
                'linear-gradient(135deg, #fd79a8, #e84393)',
                'linear-gradient(135deg, #fdcb6e, #f39c12)',
                'linear-gradient(135deg, #00b894, #00cec9)',
            ];
            return gradients[i % gradients.length];
        }

        // ==================== 确认弹窗（预设菜品） ====================
        function openConfirm(food) {
            selectedFood = { name: food.name, emoji: food.emoji };
            document.getElementById('modalEmoji').textContent = food.emoji;
            document.getElementById('modalFoodName').textContent = food.name;
            document.getElementById('modalConfirm').style.display = 'flex';
            document.getElementById('btnConfirm').disabled = false;
            document.getElementById('btnConfirm').innerHTML = '✨ 就吃这个！';
        }

        // ==================== "其他"输入弹窗 ====================
        function openOther() {
            document.getElementById('customFoodInput').value = '';
            document.getElementById('modalOther').style.display = 'flex';
            document.getElementById('btnCustomConfirm').disabled = false;
            document.getElementById('btnCustomConfirm').innerHTML = '✨ 就吃这个！';
            setTimeout(() => document.getElementById('customFoodInput').focus(), 300);
        }

        function confirmCustom() {
            const input = document.getElementById('customFoodInput');
            const val = input.value.trim();
            if (!val) {
                input.style.borderColor = '#ff4d6a';
                input.placeholder = '请填写想吃的~';
                input.focus();
                return;
            }
            if (val.length > 20) {
                input.style.borderColor = '#ff4d6a';
                return;
            }
            selectedFood = { name: val, emoji: '🍽️' };
            document.getElementById('btnCustomConfirm').disabled = true;
            document.getElementById('btnCustomConfirm').innerHTML = '<span class="spinner"></span>发送中...';
            sendNotify();
        }

        // 回车确认
        document.getElementById('customFoodInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') confirmCustom();
            // 输入时恢复边框
            this.style.borderColor = '#e8ddf5';
        });

        // ==================== 关闭弹窗 ====================
        function closeAllModals() {
            document.getElementById('modalConfirm').style.display = 'none';
            document.getElementById('modalOther').style.display = 'none';
            selectedFood = null;
        }

        document.getElementById('modalConfirm').addEventListener('click', function(e) {
            if (e.target === this) closeAllModals();
        });
        document.getElementById('modalOther').addEventListener('click', function(e) {
            if (e.target === this) closeAllModals();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals();
        });

        // ==================== 发送通知 ====================
        async function sendNotify() {
            if (!selectedFood) return;

            const isCustom = !foods.find(f => f.name === selectedFood.name);
            const btnId = isCustom ? 'btnCustomConfirm' : 'btnConfirm';
            const btn = document.getElementById(btnId);
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>发送中...';

            try {
                const now = new Date();
                const bj = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
                const timeStr = bj.getFullYear() + '-' +
                    String(bj.getMonth()+1).padStart(2,'0') + '-' +
                    String(bj.getDate()).padStart(2,'0') + ' ' +
                    String(bj.getHours()).padStart(2,'0') + ':' +
                    String(bj.getMinutes()).padStart(2,'0');
                const days = ['日','一','二','三','四','五','六'];
                const dayStr = days[bj.getDay()];

                const resp = await fetch(`${SERVER_CHAN_URL}/${SENDKEY}.send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: `💕 宝贝想吃的：${selectedFood.emoji} ${selectedFood.name}`,
                        desp: [
                            `## 💕 约会吃什么？`,
                            ``,
                            `| 项目 | 内容 |`,
                            `|------|------|`,
                            `| 🍽️ **美食** | **${selectedFood.emoji} ${selectedFood.name}** |`,
                            `| 📅 **时间** | ${timeStr} (星期${dayStr}) |`,
                            ``,
                            `> 快带宝贝去吃 **${selectedFood.name}** 吧！❤️`,
                        ].join('\n'),
                    }),
                });

                const data = await resp.json();
                if (data && data.code === 0) {
                    closeAllModals();
                    showToast('已经告诉 TA 啦~ ❤️', 'success');
                } else {
                    throw new Error((data && data.message) || '发送失败');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '✨ 就吃这个！';
                showToast('通知发送失败，请重试 😢', 'error');
                console.error('Notify error:', err);
            }
        }

        // ==================== Toast ====================
        function showToast(msg, type) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transition = 'opacity 0.4s ease';
                setTimeout(() => t.remove(), 400);
            }, 2500);
        }

        // ==================== 启动 ====================
        createHearts();
        createCards();
    </script>
</body>
</html>
