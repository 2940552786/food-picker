<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 想吃什么呢？</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --purple: #c44dff;
            --bg-start: #fff0f5;
            --bg-end: #f3e8ff;
            --card-bg: #ffffff;
            --text: #2d1b3d;
            --text-light: #6b5b7b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f5 0%, #f8e8ff 30%, #ffe8f0 60%, #f0e6ff 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* ---- 浮动爱心背景 ---- */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            font-size: 20px;
            opacity: 0.15;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.15;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* ---- 主容器 ---- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ---- 头部 ---- */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header .icon-row {
            font-size: 48px;
            animation: bounce 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .header h1 {
            font-size: clamp(24px, 5vw, 36px);
            color: #2d1b3d;
            margin: 8px 0 4px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: clamp(13px, 2.5vw, 16px);
            color: #8b7b9b;
            font-weight: 400;
        }

        .header .subtitle .name {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* ---- 美食卡片网格 ---- */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 28px;
        }

        @media (min-width: 600px) {
            .food-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 900px) {
            .food-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
        }

        /* ---- 单个卡片 ---- */
        .food-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            background: #e8ddf5;
            box-shadow: 0 4px 20px rgba(150, 100, 180, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .food-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 36px rgba(150, 100, 180, 0.25);
        }

        .food-card:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }

        .food-card .card-img {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .food-card:hover .card-img {
            transform: scale(1.1);
        }

        .food-card .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.65) 0%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.05) 100%
            );
            transition: background 0.3s ease;
        }

        .food-card:hover .card-overlay {
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.02) 100%
            );
        }

        .food-card .card-emoji {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .food-card:hover .card-emoji {
            transform: scale(1.2) rotate(-10deg);
        }

        .food-card .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 12px;
            color: #fff;
            font-weight: 700;
            font-size: clamp(16px, 3vw, 20px);
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* 图片加载前的占位渐变 */
        .food-card .card-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            z-index: 0;
        }

        /* ---- 模态弹窗 ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-dialog {
            background: #fff;
            border-radius: 24px;
            padding: 36px 28px 28px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8) translateY(30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-dialog .modal-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: bounce 1.5s ease-in-out infinite;
        }

        .modal-dialog h2 {
            font-size: 22px;
            color: #2d1b3d;
            margin-bottom: 6px;
        }

        .modal-dialog .food-name-highlight {
            display: inline-block;
            background: linear-gradient(135deg, #fff0f5, #f8e8ff);
            color: #c44dff;
            font-weight: 800;
            font-size: 26px;
            padding: 2px 14px;
            border-radius: 12px;
            margin: 8px 0 16px;
        }

        .modal-dialog .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-cancel {
            background: #f0e8f5;
            color: #6b5b7b;
        }

        .btn-cancel:hover {
            background: #e5d8f0;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #ff6b9d, #c44dff);
            color: #fff;
            box-shadow: 0 4px 16px rgba(196, 77, 255, 0.3);
        }

        .btn-confirm:hover {
            box-shadow: 0 6px 24px rgba(196, 77, 255, 0.45);
            transform: translateY(-2px);
        }

        .btn-confirm:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ---- Toast 提示 ---- */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 16px 28px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-80px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .toast-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .toast-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .toast-info {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        /* ---- 加载旋转 ---- */
        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---- Footer ---- */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #b8a8c8;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .footer .heart {
            color: #ff6b9d;
            animation: heartbeat 1.2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- 浮动爱心背景 -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="icon-row">🍽️</div>
            <h1>想吃什么呢？</h1>
            <p class="subtitle">选一个最想吃的，然后 <span class="name">告诉他</span> 💌</p>
        </div>

        <!-- 美食卡片网格 -->
        <div class="food-grid" id="foodGrid">
            <!-- JS 动态生成 -->
        </div>

        <!-- Footer -->
        <div class="footer">
            Made with <span class="heart">❤️</span> for our date
        </div>
    </div>

    <!-- 确认模态弹窗 -->
    <div class="modal-overlay" id="modal" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-emoji" id="modalEmoji">🔥</div>
            <h2>确认选择</h2>
            <div class="food-name-highlight" id="modalFoodName">火锅</div>
            <p style="color:#8b7b9b;font-size:14px;">选好了就告诉他，让他带你去吃~</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">再想想</button>
                <button class="btn btn-confirm" id="btnConfirm" onclick="confirmChoice()">
                    ✨ 就吃这个！
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 美食数据 ====================
        const foods = [
            { name: '火锅',     emoji: '🔥', img: 'hotpot,chinese-hot-pot,food' },
            { name: '湘菜',     emoji: '🌶️', img: 'hunan-cuisine,spicy-chinese-food' },
            { name: '烤鱼',     emoji: '🐟', img: 'grilled-fish,chinese-fish,delicious' },
            { name: '日料',     emoji: '🍣', img: 'sushi,japanese-food,cuisine' },
            { name: '烧烤',     emoji: '🍖', img: 'barbecue,bbq,grilled-meat,food' },
            { name: '川菜',     emoji: '🥘', img: 'sichuan-food,spicy,chinese-cuisine' },
            { name: '粤菜',     emoji: '🍗', img: 'dim-sum,cantonese-food,chinese' },
            { name: '西餐',     emoji: '🥩', img: 'steak,western-food,cuisine' },
            { name: '韩餐',     emoji: '🍜', img: 'korean-food,korean-bbq,bibimbap' },
            { name: '小龙虾',   emoji: '🦞', img: 'crayfish,crawfish,seafood' },
            { name: '东北菜',   emoji: '🥟', img: 'dumpling,chinese-northeast-food' },
            { name: '串串香',   emoji: '🍲', img: 'chinese-skewer,malatang,hotpot' },
            { name: '麻辣烫',   emoji: '🥣', img: 'malatang,spicy-soup,chinese' },
            { name: '酸菜鱼',   emoji: '🐠', img: 'sour-cabbage-fish,chinese-fish-soup' },
            { name: '泰国菜',   emoji: '🍛', img: 'thai-food,tom-yum,curry,cuisine' },
            { name: '新疆菜',   emoji: '🍢', img: 'xinjiang-food,lamb-skewer,chinese' },
            { name: '披萨',     emoji: '🍕', img: 'pizza,italian-food,delicious' },
            { name: '海鲜',     emoji: '🦀', img: 'seafood,lobster,crab,delicious' },
            { name: '云南菜',   emoji: '🍄', img: 'yunnan-food,mushroom,chinese-cuisine' },
            { name: '炸鸡汉堡', emoji: '🍔', img: 'fried-chicken,burger,fast-food' },
        ];

        // ==================== 当前选中的食物 ====================
        let selectedFood = null;

        // ==================== 生成浮动爱心 ====================
        function createFloatingHearts() {
            const container = document.getElementById('heartsBg');
            const heartEmojis = ['💕', '💖', '💗', '💝', '💘', '🩷', '❤️', '💓'];
            const count = 18;

            for (let i = 0; i < count; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart-float';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 95 + '%';
                heart.style.fontSize = (14 + Math.random() * 26) + 'px';
                heart.style.animationDuration = (8 + Math.random() * 14) + 's';
                heart.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(heart);
            }
        }

        // ==================== 生成美食卡片 ====================
        function createFoodCards() {
            const grid = document.getElementById('foodGrid');

            foods.forEach((food, index) => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.setAttribute('data-index', index);
                card.onclick = () => openModal(food);

                // 占位（图片加载前显示大emoji）
                const placeholder = document.createElement('div');
                placeholder.className = 'card-placeholder';
                placeholder.textContent = food.emoji;
                placeholder.style.background = getGradient(index);

                // 图片
                const img = document.createElement('div');
                img.className = 'card-img';
                const imgUrl = `https://source.unsplash.com/400x400/?${encodeURIComponent(food.img)}`;
                img.style.backgroundImage = `url(${imgUrl})`;

                // 遮罩
                const overlay = document.createElement('div');
                overlay.className = 'card-overlay';

                // 小emoji标签
                const emojiTag = document.createElement('div');
                emojiTag.className = 'card-emoji';
                emojiTag.textContent = food.emoji;

                // 名称标签
                const label = document.createElement('div');
                label.className = 'card-label';
                label.textContent = food.name;

                card.appendChild(placeholder);
                card.appendChild(img);
                card.appendChild(overlay);
                card.appendChild(emojiTag);
                card.appendChild(label);
                grid.appendChild(card);
            });
        }

        // 每个卡片不同的渐变占位色
        function getGradient(index) {
            const gradients = [
                'linear-gradient(135deg, #ff6b6b, #ee5a24)',
                'linear-gradient(135deg, #f368e0, #be2edd)',
                'linear-gradient(135deg, #ff9f43, #ee5a24)',
                'linear-gradient(135deg, #feca57, #ff9f43)',
                'linear-gradient(135deg, #ff6348, #c44569)',
                'linear-gradient(135deg, #e056a0, #be2edd)',
                'linear-gradient(135deg, #7bed9f, #2ed573)',
                'linear-gradient(135deg, #70a1ff, #3742fa)',
                'linear-gradient(135deg, #a29bfe, #6c5ce7)',
                'linear-gradient(135deg, #fd79a8, #e84393)',
                'linear-gradient(135deg, #fdcb6e, #f39c12)',
                'linear-gradient(135deg, #00b894, #00cec9)',
                'linear-gradient(135deg, #e17055, #d63031)',
                'linear-gradient(135deg, #74b9ff, #0984e3)',
                'linear-gradient(135deg, #f8a5c2, #e66767)',
                'linear-gradient(135deg, #f3a683, #f19066)',
                'linear-gradient(135deg, #dfe6e9, #b2bec3)',
                'linear-gradient(135deg, #55efc4, #00b894)',
                'linear-gradient(135deg, #81ecec, #00cec9)',
                'linear-gradient(135deg, #fab1a0, #e17055)',
            ];
            return gradients[index % gradients.length];
        }

        // ==================== 模态弹窗 ====================
        function openModal(food) {
            selectedFood = food;
            document.getElementById('modalEmoji').textContent = food.emoji;
            document.getElementById('modalFoodName').textContent = food.name;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('btnConfirm').disabled = false;
            document.getElementById('btnConfirm').innerHTML = '✨ 就吃这个！';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            selectedFood = null;
        }

        // 点击遮罩关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ==================== Server酱 配置 ====================
        // 在 https://sct.ftqq.com/ 微信登录后获取 SendKey 替换下方
        const SENDKEY = 'SCT379441Tav8ooADrFYlXdiwLEZTrvM7D';
        const SERVER_CHAN_URL = 'https://sctapi.ftqq.com';

        // ==================== 确认选择 ====================
        async function confirmChoice() {
            if (!selectedFood) return;

            const btn = document.getElementById('btnConfirm');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>发送中...';

            try {
                // 生成北京时间
                const now = new Date();
                const bjTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
                const timeStr = bjTime.getFullYear() + '-' +
                    String(bjTime.getMonth() + 1).padStart(2, '0') + '-' +
                    String(bjTime.getDate()).padStart(2, '0') + ' ' +
                    String(bjTime.getHours()).padStart(2, '0') + ':' +
                    String(bjTime.getMinutes()).padStart(2, '0') + ':' +
                    String(bjTime.getSeconds()).padStart(2, '0');
                const days = ['日', '一', '二', '三', '四', '五', '六'];
                const dayStr = days[bjTime.getDay()];

                const foodName = selectedFood.name;
                const foodEmoji = selectedFood.emoji;

                // 调用 Server酱 API
                const resp = await fetch(`${SERVER_CHAN_URL}/${SENDKEY}.send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: `💕 宝贝想吃的：${foodEmoji} ${foodName}`,
                        desp: `## 💕 约会吃什么？\n\n| 项目 | 内容 |\n|------|------|\n| 🍽️ **美食** | **${foodEmoji} ${foodName}** |\n| 📅 **时间** | ${timeStr} (星期${dayStr}) |\n\n> 快带宝贝去吃 ${foodName} 吧！❤️`,
                    }),
                });

                const data = await resp.json();

                if (data && data.code === 0) {
                    closeModal();
                    showToast('已经告诉 TA 啦~ ❤️', 'success');
                } else {
                    const errMsg = (data && data.message) || '发送失败';
                    throw new Error(errMsg);
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '✨ 就吃这个！';
                showToast('通知发送失败，请重试 😢', 'error');
                console.error('Notify error:', err);
            }
        }

        // ==================== Toast 提示 ====================
        function showToast(msg, type) {
            // 移除旧 toast
            const old = document.querySelector('.toast');
            if (old) old.remove();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 2500);
        }

        // ==================== ESC 关闭弹窗 ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ==================== 初始化 ====================
        createFloatingHearts();
        createFoodCards();
    </script>
</body>
</html>
