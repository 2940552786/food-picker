<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>💕 想吃什么呢？</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --purple: #c44dff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #fff0f5 0%, #f8e8ff 25%, #ffe0ec 50%, #f3e6ff 75%, #fff0f5 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* ---- 浮动背景 ---- */
        .hearts-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .heart-float {
            position: absolute; opacity: 0.12;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(105vh) scale(0.4) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.12; }
            90%  { opacity: 0.12; }
            100% { transform: translateY(-10vh) scale(1.1) rotate(360deg); opacity: 0; }
        }

        /* ---- 主容器 ---- */
        .container {
            position: relative; z-index: 1;
            max-width: 800px; margin: 0 auto; padding: 25px 16px 50px;
        }

        /* ---- 头部 ---- */
        .header { text-align: center; margin-bottom: 6px; }
        .header .icon-row {
            font-size: 44px; display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-10px); }
        }
        .header h1 {
            font-size: clamp(26px, 5.5vw, 38px);
            background: linear-gradient(135deg, #ff4d6a, #c44dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 4px 0 2px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: clamp(13px, 2.2vw, 15px);
            color: #9b8aad; font-weight: 400;
        }
        .header .ver {
            font-size: 10px; color: #d0c0e0; margin-top: 2px;
        }

        /* ---- 网格 ---- */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px; margin-top: 20px;
        }
        @media (min-width: 600px) {
            .food-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
        }
        @media (min-width: 800px) {
            .food-grid { grid-template-columns: repeat(5, 1fr); gap: 20px; }
        }

        /* ---- 卡通卡片 ---- */
        .food-card {
            position: relative;
            background: #fff;
            border-radius: 20px;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 16px rgba(150,100,180,0.10);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
        }
        .food-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 12px 30px rgba(150,100,180,0.18);
        }
        .food-card:active { transform: scale(0.95); transition: transform 0.1s ease; }

        /* 顶部色条 */
        .food-card .card-stripe {
            position: absolute; top: 0; left: 0; right: 0;
            height: 6px;
            border-radius: 20px 20px 0 0;
        }

        /* 大 emoji */
        .food-card .card-emoji {
            font-size: 52px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.08));
        }
        .food-card:hover .card-emoji {
            transform: scale(1.15);
        }

        /* 菜名 */
        .food-card .card-name {
            font-size: 16px;
            font-weight: 800;
            color: #3d2b4d;
            letter-spacing: 1px;
        }

        /* "其他" 卡片 */
        .food-card.card-other {
            border: 3px dashed #d8c8e8;
            background: linear-gradient(135deg, #fefafe, #fdf5ff);
        }
        .food-card.card-other .card-other-icon {
            font-size: 38px; transition: transform 0.3s ease;
        }
        .food-card.card-other:hover .card-other-icon { transform: scale(1.15) rotate(5deg); }
        .food-card.card-other .card-other-hint {
            font-size: 11px; color: #b8a8cc;
        }

        /* ---- 模态弹窗 ---- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }

        .modal-dialog {
            background: #fff; border-radius: 24px;
            padding: 32px 26px 26px;
            width: 90%; max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8) translateY(30px); opacity:0; }
            to   { transform: scale(1) translateY(0); opacity:1; }
        }
        .modal-dialog .modal-emoji { font-size: 56px; margin-bottom: 8px; }
        .modal-dialog h2 { font-size: 20px; color: #2d1b3d; margin-bottom: 4px; }
        .modal-dialog .food-name-highlight {
            display: inline-block;
            background: linear-gradient(135deg, #fff0f5, #f8e8ff);
            color: #c44dff; font-weight: 800; font-size: 24px;
            padding: 2px 14px; border-radius: 12px; margin: 8px 0 14px;
            max-width: 100%; word-break: break-all;
        }
        .modal-dialog .modal-sub { color: #8b7b9b; font-size: 13px; margin-bottom: 4px; }

        .modal-input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e8ddf5; border-radius: 14px;
            font-size: 18px; text-align: center;
            font-weight: 600; color: #2d1b3d;
            outline: none; transition: border 0.2s;
            letter-spacing: 1px;
        }
        .modal-input:focus { border-color: #c44dff; }
        .modal-input::placeholder { color: #c8b8d8; font-weight: 400; }

        .modal-buttons { display: flex; gap: 12px; margin-top: 18px; }

        .btn {
            flex: 1; padding: 13px 16px; border-radius: 14px;
            border: none; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.95); }
        .btn-cancel { background: #f0e8f5; color: #6b5b7b; }
        .btn-cancel:hover { background: #e5d8f0; }
        .btn-confirm {
            background: linear-gradient(135deg, #ff4d6a, #c44dff);
            color: #fff;
            box-shadow: 0 4px 16px rgba(196,77,255,0.3);
        }
        .btn-confirm:hover {
            box-shadow: 0 6px 24px rgba(196,77,255,0.45);
            transform: translateY(-2px);
        }
        .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ---- Toast ---- */
        .toast {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%); z-index: 2000;
            padding: 15px 26px; border-radius: 18px;
            font-weight: 700; font-size: 15px; color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            animation: slideDown 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            text-align: center; max-width: 90%;
        }
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-80px); opacity:0; }
            to   { transform: translateX(-50%) translateY(0); opacity:1; }
        }
        .toast-success { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .toast-error  { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to{transform:rotate(360deg)} }

        .footer {
            text-align: center; margin-top: 35px;
            color: #c8b8d8; font-size: 12px; letter-spacing: 1px;
        }
        .footer .heart {
            color: #ff6b9d; display: inline-block;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%,100%{transform:scale(1)} 25%{transform:scale(1.3)} 50%{transform:scale(1)} 75%{transform:scale(1.3)}
        }

        .input-hint { font-size: 11px; color: #b8a8cc; margin-top: 4px; }

        /* ---- 日期时间选择 ---- */
        .datetime-row {
            display: flex; gap: 10px; margin: 12px 0 0;
        }
        .dt-input {
            flex: 1; padding: 12px 10px;
            border: 2px solid #e8ddf5; border-radius: 12px;
            font-size: 15px; text-align: center;
            font-weight: 600; color: #2d1b3d;
            outline: none; transition: border 0.2s;
            background: #fdfbff;
            -webkit-tap-highlight-color: transparent;
        }
        .dt-input:focus { border-color: #c44dff; }
    </style>
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <div class="header">
            <div class="icon-row">💕</div>
            <h1>想吃什么呢？</h1>
            <p class="subtitle">选一个你想吃的，告诉我~</p>
            <p class="ver">v2.0 卡通版</p>
        </div>

        <div class="food-grid" id="foodGrid"></div>

        <div class="footer">
            Made with <span class="heart">❤️</span> for our date
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modalConfirm" style="display:none;">
        <div class="modal-dialog">
            <div class="modal-emoji" id="modalEmoji">🔥</div>
            <h2>就选这个？</h2>
            <div class="food-name-highlight" id="modalFoodName">火锅</div>
            <p class="modal-sub">选个时间，告诉他~</p>
            <div class="datetime-row">
                <input type="date" class="dt-input" id="confirmDate">
                <input type="time" class="dt-input" id="confirmTime" value="18:00">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeAllModals()">再想想</button>
                <button class="btn btn-confirm" id="btnConfirm" onclick="sendNotify()">
                    ✨ 就吃这个！
                </button>
            </div>
        </div>
    </div>

    <!-- "其他" 输入弹窗 -->
    <div class="modal-overlay" id="modalOther" style="display:none;">
        <div class="modal-dialog">
            <div class="modal-emoji">✏️</div>
            <h2>想吃点什么？</h2>
            <p class="modal-sub">手动写下你想吃的~</p>
            <input type="text" class="modal-input" id="customFoodInput"
                placeholder="比如：螺蛳粉、椰子鸡..."
                maxlength="20" autocomplete="off">
            <div class="datetime-row">
                <input type="date" class="dt-input" id="customDate">
                <input type="time" class="dt-input" id="customTime" value="18:00">
            </div>
            <p class="input-hint">写好后点确认，就会告诉他啦~</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeAllModals()">取消</button>
                <button class="btn btn-confirm" id="btnCustomConfirm" onclick="confirmCustom()">
                    ✨ 就吃这个！
                </button>
            </div>
        </div>
    </div>

    <script>
        const SENDKEY = 'SCT379441Tav8ooADrFYlXdiwLEZTrvM7D';
        const SERVER_CHAN_URL = 'https://sctapi.ftqq.com';

        const foods = [
            { name: '湘菜',   emoji: '🌶️' },
            { name: '烤鱼',   emoji: '🐟' },
            { name: '日料',   emoji: '🍣' },
            { name: '小火锅', emoji: '🫕' },
            { name: '烤肉',   emoji: '🥩' },
            { name: '西餐',   emoji: '🍝' },
            { name: '麻辣烫', emoji: '🥘' },
            { name: '披萨',   emoji: '🍕' },
            { name: '汉堡',   emoji: '🍔' },
        ];

        const stripeColors = [
            '#ff6b6b','#ff9f43','#feca57','#ff6348',
            '#e056a0','#a29bfe','#fd79a8','#fdcb6e','#00b894',
        ];

        let selectedFood = null;

        function createHearts() {
            const c = document.getElementById('heartsBg');
            const hearts = ['💕','💖','💗','💝','💘','❤️','💓','🩷','💌','🌹'];
            for(let i=0; i<22; i++) {
                const h = document.createElement('span');
                h.className = 'heart-float';
                h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
                h.style.left = Math.random()*95+'%';
                h.style.fontSize = (12+Math.random()*24)+'px';
                h.style.animationDuration = (8+Math.random()*16)+'s';
                h.style.animationDelay = Math.random()*12+'s';
                c.appendChild(h);
            }
        }

        function createCards() {
            const grid = document.getElementById('foodGrid');

            foods.forEach((food, i) => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.onclick = () => openConfirm(food);

                // 顶部彩色条
                const stripe = document.createElement('div');
                stripe.className = 'card-stripe';
                stripe.style.background = stripeColors[i];

                // 大 emoji
                const emoji = document.createElement('div');
                emoji.className = 'card-emoji';
                emoji.textContent = food.emoji;

                // 菜名
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = food.name;

                card.appendChild(stripe);
                card.appendChild(emoji);
                card.appendChild(name);
                grid.appendChild(card);
            });

            // "其他" 卡片
            const other = document.createElement('div');
            other.className = 'food-card card-other';
            other.onclick = () => openOther();
            other.innerHTML = `
                <div class="card-other-icon">✏️</div>
                <div class="card-name">其他</div>
                <div class="card-other-hint">手动输入</div>
            `;
            grid.appendChild(other);
        }

        function openConfirm(food) {
            selectedFood = { name: food.name, emoji: food.emoji };
            document.getElementById('modalEmoji').textContent = food.emoji;
            document.getElementById('modalFoodName').textContent = food.name;
            // 默认日期：明天
            const defDate = getDefaultDate();
            document.getElementById('confirmDate').value = defDate;
            document.getElementById('confirmDate').min = defDate;
            document.getElementById('confirmTime').value = '18:00';
            document.getElementById('modalConfirm').style.display = 'flex';
            document.getElementById('btnConfirm').disabled = false;
            document.getElementById('btnConfirm').innerHTML = '✨ 就吃这个！';
        }

        function openOther() {
            document.getElementById('customFoodInput').value = '';
            const defDate = getDefaultDate();
            document.getElementById('customDate').value = defDate;
            document.getElementById('customDate').min = defDate;
            document.getElementById('customTime').value = '18:00';
            document.getElementById('modalOther').style.display = 'flex';
            document.getElementById('btnCustomConfirm').disabled = false;
            document.getElementById('btnCustomConfirm').innerHTML = '✨ 就吃这个！';
            setTimeout(() => document.getElementById('customFoodInput').focus(), 300);
        }

        function getDefaultDate() {
            const d = new Date();
            // 如果今天已经过了20点，默认明天
            if (d.getHours() >= 20) d.setDate(d.getDate() + 1);
            return d.getFullYear() + '-' +
                String(d.getMonth()+1).padStart(2,'0') + '-' +
                String(d.getDate()).padStart(2,'0');
        }

        function confirmCustom() {
            const input = document.getElementById('customFoodInput');
            const val = input.value.trim();
            if (!val) {
                input.style.borderColor = '#ff4d6a';
                input.placeholder = '请填写想吃的~';
                input.focus();
                return;
            }
            selectedFood = { name: val, emoji: '🍽️' };
            document.getElementById('btnCustomConfirm').disabled = true;
            document.getElementById('btnCustomConfirm').innerHTML = '<span class="spinner"></span>发送中...';
            sendNotify();
        }

        document.getElementById('customFoodInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') confirmCustom();
            this.style.borderColor = '#e8ddf5';
        });

        function closeAllModals() {
            document.getElementById('modalConfirm').style.display = 'none';
            document.getElementById('modalOther').style.display = 'none';
            selectedFood = null;
        }

        document.getElementById('modalConfirm').addEventListener('click', function(e) {
            if (e.target === this) closeAllModals();
        });
        document.getElementById('modalOther').addEventListener('click', function(e) {
            if (e.target === this) closeAllModals();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals();
        });

        async function sendNotify() {
            if (!selectedFood) return;

            const isCustom = !foods.find(f => f.name === selectedFood.name);
            const btnId = isCustom ? 'btnCustomConfirm' : 'btnConfirm';
            const btn = document.getElementById(btnId);
            const dateId = isCustom ? 'customDate' : 'confirmDate';
            const timeId = isCustom ? 'customTime' : 'confirmTime';

            // 验证日期和时间已填
            const dateVal = document.getElementById(dateId).value;
            const timeVal = document.getElementById(timeId).value;
            if (!dateVal || !timeVal) {
                showToast('请选择日期和时间~ 📅', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>发送中...';

            try {
                // 格式化日期显示
                const dateObj = new Date(dateVal + 'T' + (timeVal || '00:00'));
                const days = ['日','一','二','三','四','五','六'];
                const dayStr = days[dateObj.getDay()];
                const dateDisplay = dateVal.replace(/-/g, '/') + ' (星期' + dayStr + ')';
                const timeDisplay = timeVal;

                const resp = await fetch(`${SERVER_CHAN_URL}/${SENDKEY}.send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: `💕 小米粥想吃的：${selectedFood.emoji} ${selectedFood.name}`,
                        desp: [
                            `## 💕 约会吃什么？`,
                            ``,
                            `| 项目 | 内容 |`,
                            `|------|------|`,
                            `| 🍽️ **美食** | **${selectedFood.emoji} ${selectedFood.name}** |`,
                            `| 📅 **日期** | ${dateDisplay} |`,
                            `| ⏰ **时间** | ${timeDisplay} |`,
                            ``,
                            `> 快带小米粥去吃 **${selectedFood.name}** 吧！❤️`,
                        ].join('\n'),
                    }),
                });

                const data = await resp.json();
                if (data && data.code === 0) {
                    closeAllModals();
                    showToast('已经告诉 TA 啦~ ❤️', 'success');
                } else {
                    throw new Error((data && data.message) || '发送失败');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '✨ 就吃这个！';
                showToast('通知发送失败，请重试 😢', 'error');
                console.error('Notify error:', err);
            }
        }

        function showToast(msg, type) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transition = 'opacity 0.4s ease';
                setTimeout(() => t.remove(), 400);
            }, 2500);
        }

        createHearts();
        createCards();
    </script>
</body>
</html>
